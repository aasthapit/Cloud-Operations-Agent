# ============================================================================
# Mock world fault script.
# Only read in mock mode (CLOUDOPS_BACKEND_MODE=mock). Both mock MCP
# backends derive from ONE world state built from fleet.yaml +
# applications.yaml + this file, so the OpenShift and observability servers
# always tell the same story (FR-MCP-6).
#
# Anything not listed here is healthy. Cluster names must be explicit
# clusters from fleet.yaml; app entries key on (application, cluster).
# Edit and save to change the demo story live; the mock servers hot-reload.
# ============================================================================

version: 1

clusters:
  # The primary demo cluster: degraded ingress while worker nodes roll for
  # maintenance. Attestation must report degraded + maintenance signals and
  # attribute payments-api flakiness partly to the platform (flows F1, F4).
  prod-east-2:
    cluster_operators_degraded:
      - name: ingress
        since: "13:41"
        message: "IngressController router-default degraded: canary route checks failing"
    machine_config_pools:
      - { name: worker, updating: true, machine_count: 6, updated_count: 4, ready_count: 5 }
    cordoned_nodes: 2
    firing_alerts:
      - { name: ClusterOperatorDegraded, severity: warning, namespace: openshift-ingress-operator, summary: "ingress operator degraded" }

  # Platform-attributable incident cluster for the SRE flow (F4).
  prod-west-4:
    cluster_operators_degraded:
      - name: ingress
        since: "12:03"
        message: "router pods restarting on cordoned nodes"
    machine_config_pools:
      - { name: worker, updating: true, machine_count: 9, updated_count: 3, ready_count: 8 }
    cordoned_nodes: 2
    firing_alerts:
      - { name: ClusterOperatorDegraded, severity: critical, namespace: openshift-ingress-operator, summary: "ingress operator degraded" }
    apiserver_error_rate: 0.014

  # Mid-upgrade cluster: everything reports maintenance, nothing degraded.
  nonprod-west-2:
    upgrading_to: 4.16.10
    machine_config_pools:
      - { name: master, updating: true, machine_count: 3, updated_count: 1, ready_count: 3 }

  # Broken monitoring: the Watchdog dead man's switch is absent, so the
  # attestation verdict must be `unattestable`, not `healthy` (FR-ATT-5).
  prod-eu-1:
    watchdog_absent: true
    monitoring_degraded: true

apps:
  # The demo application fault: payments-api OOM-crashlooping in prod-east-2
  # while the same app is healthy in prod-east-1. Drives acceptance
  # criterion 2 end to end.
  - application: payments-api
    cluster: prod-east-2
    namespace: payments-prod
    crashloop: true
    oomkilled: true
    restarts_last_hour: 7
    memory_p95_ratio: 0.97
    error_rate: 0.062
    pods_ready: 4
    pods_desired: 6

  # CronJob misbehavior for the onboarding flow (F3).
  - application: inventory-sync
    cluster: nonprod-east-1
    namespace: logistics-dev
    cronjob_missed_schedules: 3

  # Mild latency drift so the SRE flow (F2) has something worth mentioning
  # on an otherwise healthy app.
  - application: checkout
    cluster: prod-east-1
    namespace: checkout-prod
    latency_drift_pct: 12
