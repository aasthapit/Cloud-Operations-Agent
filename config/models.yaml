# ============================================================================
# Inference and agent-loop tuning.
# Hot-reloaded: services re-read this file on save; no restart needed.
# Secrets do NOT belong here (this file is committed); endpoints with
# credentials are configured via environment variables (.env).
# ============================================================================

inference:
  # How the agent reaches the model through LiteLLM. Two styles are wired:
  #
  #   openai-compat (default): treats the local Ollama server as a mock
  #     OpenAI endpoint (Ollama natively serves the OpenAI chat API at
  #     <OLLAMA_API_BASE>/v1). This is the same code path a hosted
  #     OpenAI-compatible gateway would use in production, so swapping in a
  #     real endpoint later is an env var change, not a code change.
  #   ollama-chat: LiteLLM's native ollama_chat provider. Fall back to this
  #     if a model misbehaves in tool loops over the OpenAI-compat surface
  #     (ADK docs note ollama_chat has the most battle-tested tool calling).
  provider: openai-compat

  # Model served by the local Ollama instance. Must support tool calling.
  # Known-good options installed on this machine:
  #   gpt-oss:20b  - default: strong tool discipline, reasoning kept out of
  #                  the visible answer. Needs a current blob (`ollama pull
  #                  gpt-oss:20b`); year-old blobs fail to load on modern
  #                  Ollama with a tensor size overflow error.
  #   qwen3:4b     - lighter fallback; its chain-of-thought prose opens the
  #                  visible answer (this build ignores /no_think)
  #   llama3.2:3b  - fastest, weakest tool use
  # NOTE: inference.* binds when the agent process starts; agent.* below is
  # hot-read every turn.
  model: gpt-oss:20b

  # Ollama base URL comes from the OLLAMA_API_BASE environment variable so
  # deployments can point at a remote inference host without editing config.

  # Sampling. Keep temperature low: triage should be boring and repeatable.
  temperature: 0.2
  max_output_tokens: 4096

  # Reasoning models (qwen3) think for tens of seconds before the first
  # visible token; triage narration does not need it because the evidence
  # is already gathered deterministically. Hot-read per invocation.
  disable_thinking: true

agent:
  # Safety valve for the LLM tool loop in the analysis phase. The
  # deterministic check phases are not affected by this limit.
  max_tool_iterations: 12

  # How long a cluster health attestation stays fresh within one
  # conversation thread. Past this age the agent re-attests before
  # answering new questions about that cluster.
  attestation_ttl_seconds: 300

  # Automatically run the Application 360 report once user context
  # (application + environment) is resolved. Set false to only run it
  # when the user asks.
  auto_app360: true
