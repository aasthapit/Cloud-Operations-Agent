# ============================================================================
# Application registry: the organization's catalog of applications the agent
# can triage. Hot-reloaded on save.
#
# This registry answers "who owns what" (identity claims' groups are matched
# against `owner_groups`) and carries the operational facts the Application
# 360 report's registry-sourced sections render (owners, SLA, backup policy,
# runbooks, escalation). Where an application RUNS is never taken from this
# file: placement is discovered live from Prometheus series (FR-CTX-2).
#
# `instances` below exist for the mock world builder and live-mode hints
# only; the agent always verifies placement through obs__find_app_placements.
#
# SEED FIXTURE for the MongoDB fleet registry (docs/design/LIVE-CUTOVER.md).
# `python -m cloudops.registry.seed` loads this file into the `apps` and
# `placements` collections; Mongo is the runtime truth from then on, and an
# edit here only takes effect on the next seed run.
#
#   app_id           short code a human actually types ("SSOP"); the natural
#                    key of the apps collection and what resolve_entity
#                    matches exactly
#   lob              line of business; carried onto every placement so
#                    blast_radius can answer LOB-scoped questions
#   live_placements  explicit placements on the reference kind fleet, for the
#                    apps that are really deployed there by deploy/live/.
#                    Apps without it get placements DERIVED from `instances`
#                    by matching each instance's environment to live clusters
#                    of the same environment (see registry/seed.py). The
#                    explicit form exists because the kind fleet's
#                    environment labels do not line up with the demo
#                    namespaces, and a registry that guesses would then be
#                    wrong about the one scenario the demo depends on.
# ============================================================================

version: 1

applications:
  - application: payments-api
    app_id: PAY
    lob: Payments
    # app.kubernetes.io/name on its pods. deploy/live/3*-*.yaml sets exactly
    # this label, which is what makes live placement discovery find the app on
    # acm-spoke-1a (healthy) and acm-spoke-2a (crash-looping sidecar).
    app_label: payments-api
    owner_groups: [payments-eng]
    criticality: high
    sla: "99.9% monthly"
    slo: "p95 latency < 400ms, error rate < 1%"
    owners:
      business: payments product team
      technical: payments-eng
      support_team: payments-eng on-call
    on_call: payments-eng-oncall
    escalation: payments-eng-oncall -> platform-sre -> incident commander
    runbook_url: https://runbooks.example.internal/payments-api
    monitoring_owner: payments-eng
    docs_status: complete
    dependencies:
      - { name: payments-db, type: database }
      - { name: ledger-kafka, type: message_queue }
      - { name: fraud-scoring-api, type: internal_service }
    backup:
      policy: nightly snapshot of payments-db
      rpo: 24h
      rto: 4h
    instances:
      - { cluster: prod-east-1, namespace: payments-prod, environment: prod }
      - { cluster: prod-east-2, namespace: payments-prod, environment: prod }
      - { cluster: nonprod-east-1, namespace: payments-dev, environment: nonprod }
    live_placements:
      - { cluster: acm-spoke-1a, namespace: payments-prod, environment: prod }
      - { cluster: acm-spoke-2a, namespace: payments-prod, environment: nonprod }

  - application: checkout
    app_id: CHKT
    lob: Retail
    app_label: checkout
    owner_groups: [retail-sre]
    criticality: high
    sla: "99.95% monthly"
    slo: "p95 latency < 300ms, error rate < 0.5%"
    owners:
      business: digital storefront team
      technical: retail-eng
      support_team: retail-sre
    on_call: retail-sre-oncall
    escalation: retail-sre-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/checkout
    monitoring_owner: retail-sre
    docs_status: complete
    dependencies:
      - { name: cart-redis, type: cache }
      - { name: orders-db, type: database }
    backup: { policy: continuous WAL shipping, rpo: 15m, rto: 1h }
    instances:
      - { cluster: prod-east-1, namespace: checkout-prod, environment: prod }
      - { cluster: prod-east-2, namespace: checkout-prod, environment: prod }
      - { cluster: prod-west-4, namespace: checkout-prod, environment: prod }

  - application: loyalty
    app_id: LOYL
    lob: Retail
    app_label: loyalty
    owner_groups: [retail-sre]
    criticality: medium
    sla: "99.5% monthly"
    slo: "p95 latency < 800ms"
    owners: { business: loyalty program team, technical: retail-eng, support_team: retail-sre }
    on_call: retail-sre-oncall
    escalation: retail-sre-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/loyalty
    monitoring_owner: retail-sre
    docs_status: partial
    dependencies: [{ name: loyalty-db, type: database }]
    backup: { policy: nightly snapshot, rpo: 24h, rto: 8h }
    instances:
      - { cluster: prod-west-4, namespace: loyalty-prod, environment: prod }

  - application: refunds
    app_id: RFND
    lob: Payments
    app_label: refunds
    owner_groups: [retail-sre]
    criticality: medium
    sla: "99.5% monthly"
    slo: "p95 latency < 1s"
    owners: { business: payments product team, technical: retail-eng, support_team: retail-sre }
    on_call: retail-sre-oncall
    escalation: retail-sre-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/refunds
    monitoring_owner: retail-sre
    docs_status: complete
    dependencies: [{ name: orders-db, type: database }]
    backup: { policy: nightly snapshot, rpo: 24h, rto: 8h }
    instances:
      - { cluster: prod-east-1, namespace: refunds-prod, environment: prod }

  - application: catalog
    app_id: CTLG
    lob: Retail
    app_label: catalog
    owner_groups: [retail-sre]
    criticality: medium
    sla: "99.5% monthly"
    slo: "p95 latency < 500ms"
    owners: { business: digital storefront team, technical: retail-eng, support_team: retail-sre }
    on_call: retail-sre-oncall
    escalation: retail-sre-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/catalog
    monitoring_owner: retail-sre
    docs_status: complete
    dependencies: [{ name: catalog-search, type: internal_service }]
    backup: { policy: nightly snapshot, rpo: 24h, rto: 8h }
    instances:
      - { cluster: prod-east-1, namespace: catalog-prod, environment: prod }
      - { cluster: nonprod-east-1, namespace: catalog-dev, environment: nonprod }

  - application: pricing
    app_id: PRCG
    lob: Retail
    app_label: pricing
    owner_groups: [retail-sre]
    criticality: high
    sla: "99.9% monthly"
    slo: "p95 latency < 250ms"
    owners: { business: pricing team, technical: retail-eng, support_team: retail-sre }
    on_call: retail-sre-oncall
    escalation: retail-sre-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/pricing
    monitoring_owner: retail-sre
    docs_status: complete
    dependencies: [{ name: pricing-cache, type: cache }]
    backup: { policy: config-only, rpo: n/a, rto: 1h }
    instances:
      - { cluster: prod-east-1, namespace: pricing-prod, environment: prod }

  - application: audit-log
    app_id: ADTL
    lob: Compliance
    app_label: audit-log
    owner_groups: [retail-sre]
    criticality: low
    sla: "99% monthly"
    slo: "ingest lag < 5m"
    owners: { business: compliance, technical: retail-eng, support_team: retail-sre }
    on_call: retail-sre-oncall
    escalation: retail-sre-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/audit-log
    monitoring_owner: retail-sre
    docs_status: partial
    dependencies: [{ name: audit-kafka, type: message_queue }]
    backup: { policy: object storage retention 7y, rpo: 24h, rto: 24h }
    instances:
      - { cluster: prod-east-2, namespace: audit-prod, environment: prod }

  - application: inventory-sync
    app_id: INVS
    lob: Logistics
    # Live mode finds this one on acm-spoke-1b in namespace logistics-dev,
    # deployed with the same label by deploy/live/32-logistics-dev.yaml.
    app_label: inventory-sync
    owner_groups: [logistics-eng]
    criticality: medium
    sla: "sync completes hourly"
    slo: "no more than 1 missed schedule per day"
    owners: { business: supply chain, technical: logistics-eng, support_team: logistics-eng }
    on_call: logistics-oncall
    escalation: logistics-oncall -> platform-sre
    runbook_url: https://runbooks.example.internal/inventory-sync
    monitoring_owner: logistics-eng
    docs_status: partial
    dependencies: [{ name: warehouse-api, type: external_api }]
    backup: { policy: source-of-truth upstream, rpo: n/a, rto: n/a }
    instances:
      - { cluster: nonprod-east-1, namespace: logistics-dev, environment: nonprod }
    live_placements:
      - { cluster: acm-spoke-1b, namespace: logistics-dev, environment: prod }

  # The self-service operations portal. Its short id is what a user actually
  # types ("is app SSOP down?"), which is the case the registry resolver has
  # to get right without a cluster round trip.
  - application: ssop
    app_id: SSOP
    lob: Platform
    app_label: ssop
    owner_groups: [platform-sre]
    criticality: high
    tier: platform
    description: Self-service operations portal used by every line of business
    sla: "99.9% monthly"
    slo: "p95 latency < 500ms"
    owners: { business: platform engineering, technical: platform-sre, support_team: platform-sre }
    on_call: platform-sre-oncall
    escalation: platform-sre-oncall -> incident commander
    runbook_url: https://runbooks.example.internal/ssop
    monitoring_owner: platform-sre
    docs_status: complete
    dependencies: [{ name: ssop-db, type: database }]
    backup: { policy: nightly snapshot, rpo: 24h, rto: 2h }
    instances:
      - { cluster: prod-east-1, namespace: ssop-prod, environment: prod }
      - { cluster: nonprod-east-1, namespace: ssop-dev, environment: nonprod }
    live_placements:
      - { cluster: acm-hub-1, namespace: ssop-prod, environment: prod }
      - { cluster: acm-hub-2, namespace: ssop-dev, environment: nonprod }
