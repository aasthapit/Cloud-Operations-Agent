# Minimal collector: receive OTLP/HTTP from the six services, batch, and
# forward traces to Jaeger. One trace per user turn spans the whole stack
# (NFR-OBS-1); filter by thread.id to see one conversation.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
