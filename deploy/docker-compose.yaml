# Optional local telemetry stack (NFR-OBS-4): an OTLP collector fanning out
# to Jaeger. Enable by exporting OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318
# before `make dev`; without it the services run with local-only tracing.
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC (collector -> jaeger)
