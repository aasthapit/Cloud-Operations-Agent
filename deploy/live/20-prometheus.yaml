# Single-replica Prometheus with emptyDir storage: enough to answer instant
# queries and to run a dead man's switch, not a production monitoring stack.
#
# live-prep.sh substitutes __CLUSTER_NAME__ with the fleet cluster name so
# every series carries a `cluster` label, matching the ACM/Thanos convention
# the observability tools scope by.
#
# The live observability backend reaches this Service through the API server's
# service proxy, so no NodePort and no port-forward are needed.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - nonResourceURLs: ["/metrics"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: __CLUSTER_NAME__
    rule_files:
      - /etc/prometheus/rules/*.yaml
    # Every job stamps the `cluster` label onto its own series. external_labels
    # alone is not enough: it is applied on export (federation, remote write,
    # alerting) but not to local query results, and the fleet convention is
    # that ALL PromQL is scoped by cluster=..., including queries the agent
    # writes against one cluster's own Prometheus.
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
        relabel_configs:
          - target_label: cluster
            replacement: __CLUSTER_NAME__

      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.monitoring.svc:8080]
        relabel_configs:
          - target_label: cluster
            replacement: __CLUSTER_NAME__

      - job_name: kubernetes-apiservers
        kubernetes_sd_configs: [{ role: endpoints }]
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - source_labels:
              [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: default;kubernetes;https
          - target_label: cluster
            replacement: __CLUSTER_NAME__

      # cAdvisor and kubelet come through the API server's node proxy: kind's
      # kubelet read-only port is closed and its serving cert is not trusted
      # from inside the pod network, but the proxy path is.
      - job_name: kubernetes-cadvisor
        kubernetes_sd_configs: [{ role: node }]
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - target_label: cluster
            replacement: __CLUSTER_NAME__

      - job_name: kubernetes-kubelet
        kubernetes_sd_configs: [{ role: node }]
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics
          - target_label: cluster
            replacement: __CLUSTER_NAME__
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
data:
  watchdog.yaml: |
    groups:
      - name: general.rules
        rules:
          # Dead man's switch: always firing by construction. Its ABSENCE is
          # the signal, which is exactly what the attestation battery's
          # watchdog-present check trusts (FR-ATT: unattestable, not healthy).
          - alert: Watchdog
            expr: vector(1)
            labels:
              severity: none
            annotations:
              summary: An alert that should always be firing to certify that Alertmanager is working.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
      annotations:
        cloudops.dev/config-hash: __CONFIG_HASH__
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=6h
            - --web.enable-lifecycle
          ports:
            - name: web
              containerPort: 9090
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: rules, mountPath: /etc/prometheus/rules }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 200Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            initialDelaySeconds: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: web
      port: 9090
      targetPort: web
