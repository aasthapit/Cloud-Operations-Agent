# ============================================================================
# Cloud Operations Agent - Python backend (agent, gateway, MCP servers).
# One package, one venv: services are modules run as `python -m cloudops.<svc>`.
#
# Version pins mirror PRD section 5.2 (verified against PyPI 2026-08-25).
# NOTE the mcp pin: google-adk 2.7.1 requires mcp>=1.24,<2, so the whole
# backend uses the v1 maintenance line of the MCP SDK (v1 API: FastMCP,
# lowlevel Server, streamablehttp_client). Do not bump mcp to 2.x until ADK
# supports it; docs/research/mcp-python-sdk-notes.md carries the v1->v2 map.
# ============================================================================

[project]
name = "cloudops"
version = "0.1.0"
description = "Cloud Operations Agent backend: A2A triage agent, MCP gateway, and domain MCP servers"
requires-python = ">=3.12"
dependencies = [
    "google-adk[a2a,extensions]==2.7.1",
    "a2a-sdk[http-server]==1.1.2",
    "litellm==1.98.0",
    "mcp>=1.29.1,<2",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "watchfiles>=0.24",
    "structlog>=24.1",
    "uvicorn>=0.31",
    "starlette>=0.40",
    "httpx>=0.27",
    # ADK pins opentelemetry >=1.39,<=1.42.1; stay inside that window.
    "opentelemetry-sdk>=1.39,<=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<=1.42.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "honcho>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cloudops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live_smoke: talks to the real kind fleet; skipped unless CLOUDOPS_LIVE_SMOKE=1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # long lines allowed where readability wins (URLs, PromQL)

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
